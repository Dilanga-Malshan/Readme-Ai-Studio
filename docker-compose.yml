services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: readme
      POSTGRES_PASSWORD: readme
      POSTGRES_DB: readme_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readme -d readme_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build: ./frontend
    ports: ["8080:8080"]
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
