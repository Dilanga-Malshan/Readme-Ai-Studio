[project]
name = "readme-ai-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "aiosqlite>=0.21,<1", "alembic>=1.15,<2", "httpx[socks]>=0.28,<1", "jinja2>=3.1,<4", "langchain-openai>=0.3,<2", "cryptography>=44,<48", "markdown-it-py>=3,<5", "bleach>=6.2,<7", "itsdangerous>=2.2,<3", "redis>=5,<7"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["templates/*.j2"]
